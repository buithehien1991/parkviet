default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV["POSTGRES_HOST"].presence %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  username: <%= ENV["POSTGRES_USER"].presence %>
  password: <%= ENV["POSTGRES_PASSWORD"].presence %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB_NAME", "parkviet_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB_NAME_TEST", "parkviet_test") %>

production:
  primary: &production
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *production
    url: <%= ENV["CACHE_DATABASE_URL"] %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *production
    url: <%= ENV["QUEUE_DATABASE_URL"] %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *production
    url: <%= ENV["CABLE_DATABASE_URL"] %>
    migrations_paths: db/cable_migrate
